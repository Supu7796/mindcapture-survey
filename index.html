<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>九维个人成长分析量表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#1e293b;line-height:1.6;padding:24px 16px}
.wrap{max-width:600px;margin:0 auto}
h1{text-align:center;font-size:22px;font-weight:800;color:#0f172a;margin-bottom:6px}
.sub{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:24px}
.bar{margin-bottom:20px}
.bar-top{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:4px}
.bar-num{font-weight:600;color:#475569}
.bar-track{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#3366ff,#8b5cf6);border-radius:3px;transition:width .3s;width:0%}
.card{background:#fff;border-radius:14px;border:1px solid #f1f5f9;padding:18px;margin-bottom:10px;transition:.2s}
.card.done{border-color:#d9e5ff;background:#f8faff}
.q-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.q-num{width:24px;height:24px;border-radius:50%;background:#0f172a;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.q-tag{font-size:10px;font-weight:600;color:#3366ff;background:#eef4ff;padding:2px 6px;border-radius:4px;margin-right:6px}
.q-text{font-size:14px;color:#334155}
.opts{display:flex;gap:4px;margin-left:34px}
.opts button{flex:1;padding:10px 4px;border-radius:10px;border:none;background:#f1f5f9;color:#94a3b8;font-size:11px;font-weight:500;cursor:pointer;transition:.15s}
.opts button .n{display:block;font-size:11px;color:#cbd5e1;margin-bottom:2px}
.opts button:hover{background:#e2e8f0;color:#64748b}
.opts button.on{background:#0f172a;color:#fff}
.opts button.on .n{color:#94a3b8}
.contact{background:#fff;border-radius:14px;border:1px solid #f1f5f9;padding:18px;margin-top:14px}
.contact h3{font-size:14px;font-weight:600;color:#1e293b;margin-bottom:10px}
.btns{display:flex;gap:8px;margin-bottom:10px}
.btns button{padding:8px 14px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;font-size:12px;color:#64748b;cursor:pointer}
.btns button.on{background:#0f172a;color:#fff;border-color:#0f172a}
.cinp{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:13px;outline:none}
.cinp:focus{border-color:#3366ff}
.submit{width:100%;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;background:#e2e8f0;color:#94a3b8;transition:.2s}
.submit.ok{background:#0f172a;color:#fff}
.err{background:#fef2f2;color:#ef4444;padding:10px 14px;border-radius:12px;font-size:13px;margin-top:12px;display:none}
/* result */
.res h2{text-align:center;font-size:22px;font-weight:800;color:#0f172a;margin-bottom:4px}
.res .rst{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:24px}
.scard{text-align:center;background:#fff;border-radius:14px;border:1px solid #f1f5f9;padding:20px;margin-bottom:18px}
.scard .big{font-size:46px;font-weight:900;color:#0f172a}
.scard .big small{font-size:16px;color:#cbd5e1;font-weight:400}
.scard .lbl{font-size:12px;color:#94a3b8;margin:4px 0 12px}
.leg{display:flex;justify-content:center;gap:14px;font-size:11px}
.leg span{display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.svg-wrap{text-align:center;margin-bottom:20px}
.dlist h3{font-size:16px;font-weight:700;color:#0f172a;margin:24px 0 12px}
.dim{background:#fff;border-radius:12px;border:1px solid #f1f5f9;padding:14px;margin-bottom:8px}
.dim.low{border-color:#fde68a}
.dim.mid{border-color:#bfdbfe}
.dim.high{border-color:#a7f3d0}
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dname{font-size:13px;font-weight:600;color:#1e293b;display:flex;align-items:center;gap:6px}
.dname .dd{width:8px;height:8px;border-radius:50%}
.dbars{display:flex;gap:2px}
.dbars b{width:11px;height:5px;border-radius:2px;display:inline-block}
.dbars .on{background:#0f172a}
.dbars .off{background:#e2e8f0}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px}
.badge.low{background:#fef3c7;color:#d97706}
.badge.mid{background:#dbeafe;color:#2563eb}
.badge.high{background:#d1fae5;color:#059669}
.ddesc{font-size:11px;color:#94a3b8;margin-bottom:6px}
.dtip{font-size:12px;color:#475569;background:#f8fafc;border-radius:8px;padding:8px 12px;line-height:1.6}
.dtip b{color:#0f172a}
.retry{text-align:center;margin-top:20px}
.retry a{font-size:13px;color:#94a3b8;text-decoration:none}
</style>
</head>
<body>

<!-- SURVEY -->
<div class="wrap" id="survey">
<h1>九维个人成长分析量表</h1>
<p class="sub">基于组织行为学九大核心概念编制，填写约3分钟。所有信息仅用于成长支持，严格保密。</p>
<div class="bar">
<div class="bar-top"><span>进度</span><span class="bar-num" id="pct">0 / 9</span></div>
<div class="bar-track"><div class="bar-fill" id="pbar"></div></div>
</div>
<div id="questions"></div>
<div class="contact">
<h3>是否希望获得个人报告的详细解读？（免费）</h3>
<div class="btns" id="contact-btns">
<button onclick="toggleContact(true)">希望，请留下联系方式</button>
<button class="on" onclick="toggleContact(false)">暂时不需要</button>
</div>
<div id="contact-input" style="display:none"><input class="cinp" id="cinp" placeholder="请留下微信号或手机号（仅用于预约解读，严格保密）"></div>
</div>
<button class="submit" id="submit-btn" disabled onclick="doSubmit()">还需回答 9 题</button>
<div class="err" id="err"></div>
</div>

<!-- RESULT -->
<div class="wrap" id="result" style="display:none"></div>

<script>
var Q=[
  {k:'perception',l:'知觉',t:'我能够客观看待自己的优缺点，不容易因一次失败而全面否定自己。'},
  {k:'attribution',l:'归因',t:'事情不顺时，我能够平衡地看待自身原因和环境原因，不过度自责。'},
  {k:'decision',l:'决策',t:'面对选择，我能够做出决定并承担后果，不会反复纠结。'},
  {k:'values',l:'价值观',t:'我清楚自己真正在乎什么、什么是绝对不能放弃的。'},
  {k:'attitude',l:'态度',t:'我知道自己应该做什么，并且愿意去做，不会知道该做但不想做。'},
  {k:'efficacy',l:'自我效能感',t:'即使面对困难，我也相信自己最终能够完成重要任务。'},
  {k:'personality',l:'人格',t:'我了解自己的性格特点，知道在什么环境中更能发挥优势。'},
  {k:'emotion',l:'情绪',t:'我能够识别自己的情绪，并能够有效调节，不被情绪控制。'},
  {k:'resilience',l:'压力与韧性',t:'面对压力我能有效应对，经历挫折后能够较快恢复。'}
];
var D=[
  {k:'perception',l:'知觉',d:'客观看待自己，不因一次失败否定自己',lo:'试着每天写下1件自己做得好的小事，坚持21天',mi:'保持觉察，遇到失败时用纸笔写下客观事实和主观感受分开看'},
  {k:'attribution',l:'归因',d:'平衡看待自身原因和环境原因，不过度自责',lo:'下次遇到不顺时，画一个圆分两半：一半写自身原因，一半写环境原因',mi:'练习用既...又...句式'},
  {k:'decision',l:'决策',d:'能做出决定并承担后果，不反复纠结',lo:'小决定用1分钟计时器，大决定列利弊清单限24小时',mi:'不影响生命安全的事，快速决定比完美决定更重要'},
  {k:'values',l:'价值观',d:'清楚自己真正在乎什么，什么是不能放弃的',lo:'写下10个你在乎的东西，逐个划掉，剩下3个',mi:'每月末回顾，看看时间花在了你认为重要的事情上没有'},
  {k:'attitude',l:'态度',d:'知道该做什么并愿意去做，不拖延',lo:'用2分钟法则：如果2分钟内能做完，立刻做',mi:'把大任务拆成最小可执行步骤，只要求自己完成第一步'},
  {k:'efficacy',l:'自我效能感',d:'即使面对困难也相信自己能完成重要任务',lo:'回顾过去3次克服困难的经历，每次写一句我怎么做到的',mi:'找一位榜样观察他如何克服类似困难'},
  {k:'personality',l:'人格',d:'了解自己性格特点，知道在什么环境更能发挥优势',lo:'向3个熟悉你的人询问你觉得我最大的3个优点是什么',mi:'尝试在不同环境中做同一件事，观察哪种环境更自在'},
  {k:'emotion',l:'情绪',d:'能识别自己情绪并有效调节',lo:'每天用3个词记录情绪变化，给每种情绪打分1-10',mi:'当情绪强烈时，先深呼吸6秒再反应，给自己一个暂停键'},
  {k:'resilience',l:'压力与韧性',d:'面对压力能有效应对，经历挫折后能较快恢复',lo:'建立恢复清单：写下5件能让你快速恢复能量的小事',mi:'每次经历挫折后写一段经验复盘：发生了什么、学到什么、下次怎么做'}
];
var O=[{v:1,l:'完全不符合'},{v:2,l:'不太符合'},{v:3,l:'一般'},{v:4,l:'比较符合'},{v:5,l:'完全符合'}];
var A={},WC=false,CT='';

function buildSurvey(){
  var qs=document.getElementById('questions');
  qs.innerHTML='';
  Q.forEach(function(q,i){
    var sel=A[q.k];
    var card=document.createElement('div');
    card.className='card'+(sel?' done':'');
    card.innerHTML='<div class="q-row"><span class="q-num">'+(i+1)+'</span><span><span class="q-tag">'+q.l+'</span><span class="q-text">'+q.t+'</span></span></div><div class="opts"></div>';
    var opts=card.querySelector('.opts');
    O.forEach(function(o){
      var btn=document.createElement('button');
      if(sel===o.v)btn.className='on';
      btn.innerHTML='<span class="n">'+o.v+'</span>'+o.l;
      btn.onclick=function(){A[q.k]=o.v;buildSurvey();};
      opts.appendChild(btn);
    });
    qs.appendChild(card);
  });
  var done=Object.keys(A).length;
  document.getElementById('pct').textContent=done+' / 9';
  document.getElementById('pbar').style.width=(done/9*100)+'%';
  var btn=document.getElementById('submit-btn');
  if(done===9){btn.className='submit ok';btn.disabled=false;btn.textContent='提交并查看报告';}
  else{btn.className='submit';btn.disabled=true;btn.textContent='还需回答 '+(9-done)+' 题';}
}

function toggleContact(v){
  WC=v;
  if(!v)CT='';
  var bts=document.getElementById('contact-btns').children;
  bts[0].className=v?'on':''; bts[1].className=v?'':'on';
  document.getElementById('contact-input').style.display=v?'block':'none';
  if(v)document.getElementById('cinp').value='';
}

document.getElementById('cinp').addEventListener('input',function(){CT=this.value;});

function doSubmit(){
  var all=Object.keys(A);
  if(all.length<9){document.getElementById('err').style.display='block';document.getElementById('err').textContent='请完成全部9道题目';return;}
  document.getElementById('err').style.display='none';
  var total=all.reduce(function(s,k){return s+A[k];},0);
  var dims=D.map(function(d){return{dim:d,score:A[d.k]||0,level:(A[d.k]||0)<3?'low':(A[d.k]||0)<=4?'mid':'high'}});
  showResult(total,dims);
}

function showResult(total,dims){
  document.getElementById('survey').style.display='none';
  var res=document.getElementById('result');
  res.style.display='block';
  var low=dims.filter(function(d){return d.level==='low'}).length;
  var mid=dims.filter(function(d){return d.level==='mid'}).length;
  var high=dims.filter(function(d){return d.level==='high'}).length;

  var html='<div class="res"><h2>你的个人成长报告</h2><p class="rst">基于九维成长量表的分析结果</p></div>';
  html+='<div class="scard"><div class="big">'+total+'<small> / 45</small></div><div class="lbl">综合得分</div><div class="leg"><span><span class="dot" style="background:#10b981"></span>优势 '+high+'</span><span><span class="dot" style="background:#3b82f6"></span>发展 '+mid+'</span><span><span class="dot" style="background:#f59e0b"></span>卡点 '+low+'</span></div></div>';
  html+='<div class="svg-wrap">'+buildRadar(dims)+'</div>';
  html+='<div class="dlist"><h3>维度详细解读</h3>';
  dims.forEach(function(d){
    var lv=d.level;
    var colors={low:{dot:'#f59e0b',bdg:'low',txt:'成长卡点'},mid:{dot:'#3b82f6',bdg:'mid',txt:'发展中'},high:{dot:'#10b981',bdg:'high',txt:'优势领域'}};
    var c=colors[lv];
    html+='<div class="dim '+lv+'"><div class="dtop"><span class="dname"><span class="dd" style="background:'+c.dot+'"></span>'+d.dim.l+'</span><span class="badge '+c.bdg+'">'+d.score+' · '+c.txt+'</span></div>';
    html+='<div class="dbars">';
    for(var i=1;i<=5;i++)html+='<b class="'+(i<=d.score?'on':'off')+'"></b>';
    html+='</div><div class="ddesc">'+d.dim.d+'</div><div class="dtip"><b>建议：</b>'+(lv==='low'?d.dim.lo:d.dim.mi)+'</div></div>';
  });
  html+='</div><div class="retry"><a href="javascript:location.reload()">重新填写问卷</a></div>';
  res.innerHTML=html;
}

function buildRadar(dims){
  var sz=300,cx=sz/2,cy=sz/2,r=sz*0.32,lv=5,as=Math.PI*2/dims.length;
  var svg='<svg viewBox="0 0 '+sz+' '+sz+'" width="'+sz+'" height="'+sz+'">';
  for(var l=1;l<=lv;l++){
    var rr=r*l/lv,pts='';
    for(var i=0;i<dims.length;i++){var a=as*i-Math.PI/2;pts+=(cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a))+' ';}
    svg+='<polygon points="'+pts+'" fill="none" stroke="'+(l===lv?'#cbd5e1':'#e2e8f0')+'" stroke-width="'+(l===lv?'1.5':'0.5')+'"/>';
  }
  for(var i=0;i<dims.length;i++){
    var a=as*i-Math.PI/2;
    svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(a))+'" y2="'+(cy+r*Math.sin(a))+'" stroke="#e2e8f0" stroke-width="0.5"/>';
  }
  var dpts='';
  for(var i=0;i<dims.length;i++){
    var a=as*i-Math.PI/2;
    dpts+=(cx+dims[i].score/lv*r*Math.cos(a))+','+(cy+dims[i].score/lv*r*Math.sin(a))+' ';
  }
  svg+='<polygon points="'+dpts+'" fill="rgba(51,102,255,0.12)" stroke="#3366ff" stroke-width="2" stroke-linejoin="round"/>';
  for(var i=0;i<dims.length;i++){
    var a=as*i-Math.PI/2;
    var px=cx+dims[i].score/lv*r*Math.cos(a),py=cy+dims[i].score/lv*r*Math.sin(a);
    svg+='<circle cx="'+px+'" cy="'+py+'" r="4" fill="#fff" stroke="#3366ff" stroke-width="2"/>';
    var lx=cx+(r+32)*Math.cos(a),ly=cy+(r+32)*Math.sin(a);
    svg+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="central" fill="#475569" font-size="12" font-weight="600">'+dims[i].dim.l+'</text>';
    svg+='<text x="'+px+'" y="'+(py+16)+'" text-anchor="middle" fill="#3366ff" font-size="11" font-weight="700">'+dims[i].score+'</text>';
  }
  svg+='</svg>';
  return svg;
}

buildSurvey();
</script>
</body>
</html>
